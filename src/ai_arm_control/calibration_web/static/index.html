<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calibration Touch Capture</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: #fff;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    #target {
      position: fixed;
      width: 22px;
      height: 22px;
      margin-left: -11px;
      margin-top: -11px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #d8193f;
      left: 50%;
      top: 50%;
    }
    #status {
      position: fixed;
      left: 12px;
      bottom: 12px;
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="target"></div>
  <div id="status">ready</div>
  <script>
    const params = new URLSearchParams(location.search);
    const pointId = params.get("point_id") || "P01";
    const targetX = Number(params.get("x") || 0.5);
    const targetY = Number(params.get("y") || 0.5);
    const target = document.getElementById("target");
    const status = document.getElementById("status");
    target.style.left = `${targetX * 100}%`;
    target.style.top = `${targetY * 100}%`;

    window.addEventListener("pointerdown", async (event) => {
      const payload = {
        point_id: pointId,
        target_x: targetX,
        target_y: targetY,
        x: event.clientX / window.innerWidth,
        y: event.clientY / window.innerHeight
      };
      const response = await fetch("/touch", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      });
      status.textContent = response.ok ? "captured" : "failed";
    });
  </script>
</body>
</html>
